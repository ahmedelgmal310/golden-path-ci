replicaCount: 2

image:
  repository: ghcr.io/ahmedelgmal310/golden-path-ci/example-go-service
  # Prefer a digest in real environments; the tag is the chart default.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
