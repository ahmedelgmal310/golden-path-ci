# Reusable workflow: container image supply chain.
#
#   build-scan (read-only token): build for linux/amd64 -> hadolint -> Trivy gate
#   publish    (only when push):  multi-arch build + push -> cosign keyless sign
#                                 -> CycloneDX SBOM attestation -> SLSA provenance
#                                 -> verify all three before the job goes green
#
# The Dockerfile's RUN steps execute in build-scan, whose token cannot write
# packages. Nothing is pushed unless the gate passed.
name: container-image

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name without tag, lowercase, e.g. ghcr.io/acme/payments/api"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path relative to the context"
        type: string
        default: "Dockerfile"
      platforms:
        description: "Comma-separated platforms for the published image"
        type: string
        default: "linux/amd64,linux/arm64"
      build-args:
        description: "Extra build args, one KEY=value per line (VERSION is always set)"
        type: string
        default: ""
      push:
        description: "Push, sign and attest. false runs the build and gates only."
        type: boolean
        default: true
      severity:
        description: "Trivy severities that fail the gate"
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: "Only fail on vulnerabilities that have a fixed version"
        type: boolean
        default: true
      hadolint-threshold:
        description: "hadolint failure threshold (error, warning, info, style, ignore)"
        type: string
        default: "error"
      cache-version:
        description: "Cache namespace; change it to invalidate caches"
        type: string
        default: "v1"
      trivy-image:
        description: "Trivy image, pinned by digest"
        type: string
        default: "mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
      hadolint-image:
        description: "hadolint image, pinned by digest"
        type: string
        default: "mirror.gcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d"
    outputs:
      digest:
        description: "Pushed manifest-list digest (empty when push is false)"
        value: ${{ jobs.publish.outputs.digest }}
      image:
        description: "image@digest reference of the signed image"
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  build-scan:
    name: Build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Version stamp
        id: stamp
        uses: $/actions/version-stamp

      - name: hadolint
        id: hadolint
        env:
          HADOLINT_IMAGE: ${{ inputs.hadolint-image }}
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.dockerfile }}
          THRESHOLD: ${{ inputs.hadolint-threshold }}
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold "$THRESHOLD" - < "$DOCKERFILE"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build for scanning (linux/amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: gp-scan:${{ steps.stamp.outputs.short-sha }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=gp-${{ inputs.cache-version }}-${{ inputs.image-name }}
          cache-to: type=gha,scope=gp-${{ inputs.cache-version }}-${{ inputs.image-name }},mode=max

      - name: Trivy DB cache key
        id: trivy-key
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Trivy DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: gp-trivy-${{ inputs.cache-version }}-${{ steps.trivy-key.outputs.day }}
          restore-keys: |
            gp-trivy-${{ inputs.cache-version }}-

      - name: Trivy vulnerability gate
        id: trivy
        env:
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
          SEVERITY: ${{ inputs.severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
          SCAN_IMAGE: gp-scan:${{ steps.stamp.outputs.short-sha }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy" "$RUNNER_TEMP/trivy"
          flags=(--scanners vuln --severity "$SEVERITY" --no-progress)
          if [ "$IGNORE_UNFIXED" = "true" ]; then flags+=(--ignore-unfixed); fi
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$RUNNER_TEMP/trivy:/out" \
              "$TRIVY_IMAGE" "$@"
          }
          trivy image "${flags[@]}" --format json --output /out/report.json "$SCAN_IMAGE"
          trivy convert --format table /out/report.json
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$RUNNER_TEMP/trivy/report.json")
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' \
              "$RUNNER_TEMP/trivy/report.json" | sort -u | while read -r line; do echo "::error title=Trivy gate::${line}"; done
            echo "Trivy gate failed: ${count} ${SEVERITY} vulnerabilities (ignore-unfixed=${IGNORE_UNFIXED})"
            exit 1
          fi
          echo "Trivy gate passed: 0 ${SEVERITY} vulnerabilities"

      - name: Summary
        if: always()
        uses: $/actions/job-summary
        with:
          title: Container image (build and scan)
          working-directory: ${{ inputs.context }}
          results: |
            hadolint|${{ steps.hadolint.outcome }}|threshold ${{ inputs.hadolint-threshold }}
            build linux/amd64|${{ steps.build.outcome }}|version ${{ steps.stamp.outputs.version }}
            Trivy gate|${{ steps.trivy.outcome }}|${{ steps.trivy.outputs.count }} findings at ${{ inputs.severity }}, ignore-unfixed=${{ inputs.ignore-unfixed }}

  publish:
    name: Publish, sign, attest
    needs: build-scan
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing and provenance
      attestations: write # GitHub artifact attestations (SLSA provenance)
    concurrency:
      group: gp-publish-${{ inputs.image-name }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
    env:
      IMAGE: ${{ inputs.image-name }}
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Version stamp
        id: stamp
        uses: $/actions/version-stamp

      - name: Image tags
        id: tags
        env:
          TAGS: ${{ steps.stamp.outputs.image-tags }}
        run: |
          {
            echo "list<<EOF"
            while read -r t; do [ -n "$t" ] && echo "${IMAGE}:${t}"; done <<< "$TAGS"
            echo "EOF"
            echo "artifact=sbom-$(printf '%s' "${IMAGE##*/}" | tr -c '0-9A-Za-z._-' '-')-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.stamp.outputs.version }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.build-date }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=gp-${{ inputs.cache-version }}-${{ inputs.image-name }}
          cache-to: type=gha,scope=gp-${{ inputs.cache-version }}-${{ inputs.image-name }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign (keyless)
        id: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Fulcio and Rekor are public services; retry transient 5xx errors.
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt ${n} failed; retrying in $((n * 15))s"; sleep $((n * 15)); done; return 1; }
          retry cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM (CycloneDX)
        id: sbom
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TRIVY_IMAGE: ${{ inputs.trivy-image }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -v "$RUNNER_TEMP/sbom:/out" \
            "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json --no-progress \
            "${IMAGE}@${DIGEST}"
          echo "components=$(jq '.components | length' "$RUNNER_TEMP/sbom/sbom.cdx.json")" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM (cosign)
        id: attest-sbom
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Fulcio and Rekor are public services; retry transient 5xx errors.
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt ${n} failed; retrying in $((n * 15))s"; sleep $((n * 15)); done; return 1; }
          retry cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom/sbom.cdx.json" "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature, SBOM attestation and provenance
        id: verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          # The signing identity is this reusable workflow, not the caller:
          # consumers trust the platform's pipeline, pinned to a ref.
          IDENTITY: ${{ github.server_url }}/${{ job.workflow_ref }}
          SIGNER_WORKFLOW: ${{ job.workflow_repository }}/${{ job.workflow_file_path }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer=https://token.actions.githubusercontent.com
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$issuer" > /dev/null
          echo "cosign signature verified for identity $IDENTITY"
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type cyclonedx \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$issuer" > /dev/null
          echo "CycloneDX attestation verified"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPO" --signer-workflow "$SIGNER_WORKFLOW"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.tags.outputs.artifact }}
          path: ${{ runner.temp }}/sbom/sbom.cdx.json
          retention-days: 30

      - name: Summary
        if: always()
        uses: $/actions/job-summary
        with:
          title: Container image (publish)
          working-directory: ${{ inputs.context }}
          results: |
            build + push|${{ steps.push.outcome }}|`${{ inputs.image-name }}@${{ steps.push.outputs.digest }}` (${{ inputs.platforms }})
            cosign sign|${{ steps.sign.outcome }}|keyless, Fulcio + Rekor
            SBOM|${{ steps.sbom.outcome }}|CycloneDX, ${{ steps.sbom.outputs.components }} components
            SBOM attestation|${{ steps.attest-sbom.outcome }}|cosign attest --type cyclonedx
            SLSA provenance|${{ steps.provenance.outcome }}|actions/attest-build-provenance, pushed to registry
            verify|${{ steps.verify.outcome }}|cosign verify, verify-attestation, gh attestation verify
